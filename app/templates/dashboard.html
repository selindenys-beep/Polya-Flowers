<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polya Flowers — панель</title>
  <style>
    :root { --accent: #b5678a; --accent-dark: #7a3b5a; --bg: #f7f2f5; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg);
           margin: 0; color: #333; }
    header { background: #fff; padding: 16px 24px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
    header h1 { margin: 0; font-size: 20px; color: var(--accent-dark); }
    .wrap { max-width: 900px; margin: 24px auto; padding: 0 16px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 720px) { .wrap { grid-template-columns: 1fr; } }
    .card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 6px 20px rgba(0,0,0,.06); }
    .card h2 { margin: 0 0 14px; font-size: 16px; color: var(--accent-dark); }
    label { display: block; font-size: 13px; color: #777; margin: 12px 0 4px; }
    input[type=text], input[type=number], textarea {
      width: 100%; padding: 10px; border: 1px solid #e2d5dd; border-radius: 10px; font-size: 15px; }
    textarea { min-height: 70px; resize: vertical; }
    .drop { border: 2px dashed #d9c3ce; border-radius: 12px; padding: 22px; text-align: center;
            color: #a888a0; cursor: pointer; }
    .drop img { max-width: 100%; border-radius: 10px; }
    button { border: 0; border-radius: 10px; padding: 12px 16px; font-size: 15px; cursor: pointer; }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; margin-top: 16px; }
    .btn-publish { background: #2e9e5b; color: #fff; width: 100%; margin-top: 12px; }
    .btn-primary:disabled, .btn-publish:disabled { opacity: .5; cursor: not-allowed; }
    .preview img { max-width: 100%; border-radius: 12px; }
    .caption { white-space: pre-wrap; background: #faf5f8; border-radius: 10px; padding: 12px;
               margin-top: 12px; font-size: 14px; }
    .muted { color: #aaa; font-size: 13px; }
    .warn { background: #fff5e6; border: 1px solid #ffd9a0; color: #9a6b16; padding: 10px 12px;
            border-radius: 10px; font-size: 13px; margin: 0 16px 12px; }
    .status { margin-top: 10px; font-size: 14px; min-height: 18px; }
  </style>
</head>
<body>
  <header><h1>🌸 Polya Flowers — панель публікацій</h1></header>

  {% if missing_secrets %}
  <div class="warn">⚙️ Ще не налаштовано: {{ missing_secrets | join(', ') }}. Публікація запрацює після додавання ключів.</div>
  {% endif %}

  <div class="wrap">
    <!-- Ліва колонка: введення -->
    <div class="card">
      <h2>1. Новий товар</h2>
      <div class="drop" id="drop" onclick="document.getElementById('file').click()">
        <span id="dropText">📷 Натисніть, щоб додати фото букета</span>
        <img id="thumb" style="display:none">
      </div>
      <input type="file" id="file" accept="image/*" style="display:none" onchange="onFile(this)">

      <label>Опис (необов'язково)</label>
      <textarea id="desc" placeholder="Напр.: ніжний букет з піоній та евкаліпта"></textarea>

      <label>Ціна</label>
      <input type="text" id="price" placeholder="Напр.: 650 грн">

      <button class="btn-primary" id="processBtn" onclick="doProcess()" disabled>✨ Обробити</button>
      <div class="status" id="procStatus"></div>
    </div>

    <!-- Права колонка: результат -->
    <div class="card">
      <h2>2. Результат</h2>
      <div class="preview" id="preview"><span class="muted">Тут з'явиться готове фото і підпис.</span></div>
      <div class="caption" id="captionBox" style="display:none" contenteditable="true"></div>
      <button class="btn-publish" id="publishBtn" onclick="doPublish()" disabled>📢 Публікація</button>
      <div class="status" id="pubStatus"></div>
    </div>
  </div>

  <script>
    let currentFile = null;
    let productId = null;

    function onFile(input) {
      currentFile = input.files[0];
      if (!currentFile) return;
      const reader = new FileReader();
      reader.onload = e => {
        const t = document.getElementById('thumb');
        t.src = e.target.result; t.style.display = 'block';
        document.getElementById('dropText').style.display = 'none';
      };
      reader.readAsDataURL(currentFile);
      document.getElementById('processBtn').disabled = false;
    }

    async function doProcess() {
      if (!currentFile) return;
      const btn = document.getElementById('processBtn');
      btn.disabled = true;
      document.getElementById('procStatus').textContent = 'Обробляю…';
      const fd = new FormData();
      fd.append('photo', currentFile);
      fd.append('description', document.getElementById('desc').value);
      fd.append('price', document.getElementById('price').value);
      try {
        const r = await fetch('/api/process', { method: 'POST', body: fd });
        if (!r.ok) throw new Error(await r.text());
        const data = await r.json();
        productId = data.product_id;
        document.getElementById('preview').innerHTML =
          '<img src="data:image/jpeg;base64,' + data.image_base64 + '">';
        const cap = document.getElementById('captionBox');
        cap.style.display = 'block'; cap.textContent = data.caption;
        document.getElementById('publishBtn').disabled = false;
        document.getElementById('procStatus').textContent = 'Готово ✅ Можна редагувати підпис.';
      } catch (err) {
        document.getElementById('procStatus').textContent = 'Помилка: ' + err.message;
      } finally { btn.disabled = false; }
    }

    async function doPublish() {
      if (!productId) return;
      const btn = document.getElementById('publishBtn');
      btn.disabled = true;
      document.getElementById('pubStatus').textContent = 'Публікую…';
      const fd = new FormData();
      fd.append('product_id', productId);
      fd.append('caption', document.getElementById('captionBox').textContent);
      try {
        const r = await fetch('/api/publish', { method: 'POST', body: fd });
        if (!r.ok) throw new Error(await r.text());
        const data = await r.json();
        document.getElementById('pubStatus').innerHTML =
          '✅ Опубліковано!' + (data.post_url ? ' <a href="' + data.post_url + '" target="_blank">Пост</a>' : '');
      } catch (err) {
        document.getElementById('pubStatus').textContent = 'Помилка: ' + err.message;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
